name: Publish Android update mirror

on:
  release:
    types: [published]
  workflow_dispatch:

# Re-read the latest stable Release inside the serialized run instead of using the triggering tag.
concurrency:
  group: android-update-mirror
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    if: >-
      github.repository == 'dhz1145/deepseek-api' &&
      (github.event_name == 'release' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false
      - name: Prepare the verified APK and small update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/build-update-mirror.py "$RUNNER_TEMP/update-site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/update-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the mirror
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
