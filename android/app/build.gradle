plugins {
    id 'com.android.application' version '9.4.0'
}

def webProject = rootProject.projectDir.parentFile
def appVersion = new groovy.json.JsonSlurper().parse(new File(webProject, 'package.json')).version

// The current public mirror serves the small deployment. Allow a production domain override.
def r2UpdateOrigin = providers.gradleProperty('r2UpdateOrigin').getOrElse('https://pub-1e6bcf9fa6774ec59254384689fadd5a.r2.dev').trim().replaceFirst('/+$', '')
if (r2UpdateOrigin && !(r2UpdateOrigin ==~ /https:\/\/[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+/)) {
    throw new GradleException('r2UpdateOrigin must be an HTTPS origin without a path or query.')
}

def releaseSigning = new Properties()
def releaseSigningFile = rootProject.file('keystore.properties')
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}

android {
    namespace = 'io.github.dhz1145.dsapi'
    compileSdk = 37
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        buildConfigField 'String', 'R2_UPDATE_ORIGIN', groovy.json.JsonOutput.toJson(r2UpdateOrigin)
        applicationId = 'io.github.dhz1145.dsapi'
        minSdk = 29
        targetSdk = 36
        versionCode = 23
        versionName = appVersion
    }

    signingConfigs {
        release {
            storeFile file('release.jks')
            storePassword = releaseSigning.getProperty('storePassword')
            keyAlias = releaseSigning.getProperty('keyAlias', 'dsapi')
            keyPassword = releaseSigning.getProperty('keyPassword')
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

def webOutput = new File(webProject, 'dist')

tasks.register('buildWeb', Exec) {
    workingDir webProject
    commandLine org.gradle.internal.os.OperatingSystem.current().isWindows()
        ? ['cmd', '/d', '/c', 'pnpm', 'build']
        : ['pnpm', 'build']
    inputs.files(new File(webProject, 'package.json'), new File(webProject, 'pnpm-lock.yaml'),
        new File(webProject, 'rspack.config.ts'),
        new File(webProject, 'scripts/katex-woff2-loader.cjs'))
    inputs.dir(new File(webProject, 'src'))
    outputs.dir(webOutput)
}

android.sourceSets.main.assets.srcDir(webOutput)
tasks.named('preBuild').configure { dependsOn('buildWeb') }
